[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Use Netlify's built-in Pretty URLs as the single URL-normalisation layer.
# It serves the static `*.html` files at extensionless, trailing-slash URLs
# (for example, `/type-1/`) and handles legacy `*.html` requests. Keeping
# this explicit prevents a large, error-prone list of per-page redirects.
[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# The bread-unit calculator is hosted on its dedicated site. Cover both the
# legacy file URLs and Netlify Pretty URLs for every language version.
[[redirects]]
  from = "/calculator.html"
  to = "https://breadunits.top/"
  status = 301
  force = true

[[redirects]]
  from = "/calculator/"
  to = "https://breadunits.top/"
  status = 301
  force = true

[[redirects]]
  from = "/en/calculator.html"
  to = "https://breadunits.top/"
  status = 301
  force = true

[[redirects]]
  from = "/en/calculator/"
  to = "https://breadunits.top/"
  status = 301
  force = true

[[redirects]]
  from = "/es/calculator.html"
  to = "https://breadunits.top/"
  status = 301
  force = true

[[redirects]]
  from = "/es/calculator/"
  to = "https://breadunits.top/"
  status = 301
  force = true
