[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Force the extensionless duplicates created by Netlify's automatic
# "Pretty URLs" (e.g. /type-1 serving the same content as /type-1.html
# with a 200, instead of redirecting) back to the canonical .html URL
# that sitemap.xml, rel=canonical and all internal links actually use.
[[redirects]]
  from = "/type-1"
  to = "/type-1.html"
  status = 301
  force = true

